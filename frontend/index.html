<section class="watchlist">
  <h1>Watchlist</h1>

  <form id="form-filme">
    <input type="text" id="nome" placeholder="Nome do filme" required>
    <input type="number" id="ano" placeholder="Ano" min="1888" max="2100" required>
    <input type="number" id="nota" placeholder="Nota (0 a 10)" min="0" max="10" step="0.1" required>
    <input type="text" id="diretor" placeholder="Diretor" required>
    <button type="submit">Adicionar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Filme</th>
        <th>Ano de lançamento</th>
        <th>Nota</th>
        <th>Diretor</th>
      </tr>
      <link rel="stylesheet" href="style.css">
    </thead>
    <tbody id="lista-filmes"></tbody>
  </table>
</section>

<script>
  const form = document.getElementById("form-filme");
  const lista = document.getElementById("lista-filmes");

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    const linha = document.createElement("tr");
    const valores = [
      document.getElementById("nome").value,
      document.getElementById("ano").value,
      document.getElementById("nota").value.replace(".", ","),
      document.getElementById("diretor").value
    ];

    valores.forEach(function (valor) {
      const celula = document.createElement("td");
      celula.textContent = valor;
      linha.appendChild(celula);
    });

    lista.appendChild(linha);
    form.reset();
  });
</script>
